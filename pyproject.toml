[project]
name = "rnce"
version = "1.0.0"
description = "Gerador do site RNCE, repositório de projetos narrativos."
authors = [{ name = "Matheus de Andrade" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rnce = "rnce.cli:principal"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
